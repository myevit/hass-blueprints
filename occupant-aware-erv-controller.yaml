blueprint:
  name: "Continuous ERV Outdoor-Air Controller. Version: 2.0.0"
  description: |
    **Version: 2.0.0**

    Controls a normally-on, continuous-duty ERV such as the Panasonic FV-10VEC2.
    It turns the ERV off only for a stable `pollution_hold` recommendation. Normal
    ventilation, indoor-CO2 override, critical CO2, and sensor-fault fail-safe states
    request on. There is no routine duty cycle.

    Dry-run is the default. A mandatory manual blocker prevents every service call.
  domain: automation
  author: hass-blueprints
  homeassistant:
    min_version: "2025.4.0"
  input:
    entities:
      name: Required entities
      icon: mdi:hvac
      input:
        recommendation_sensor:
          name: Continuous ERV recommendation sensor
          selector:
            entity:
              filter:
                domain: sensor
        erv_switch:
          name: ERV soft-control switch
          selector:
            entity:
              filter:
                domain: switch
        manual_blocker:
          name: Manual ERV blocker
          description: On prevents all automatic changes, including fail-on and critical requests.
          selector:
            entity:
              filter:
                domain: input_boolean
    timing:
      name: Stability and switch timing
      icon: mdi:timer-cog-outline
      input:
        decision_persistence_minutes:
          name: Normal decision persistence
          description: Pollution hold and normal recovery must remain stable this long. CO2 override, critical, and sensor-fault fail-on bypass it.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 5
              unit_of_measurement: minutes
        minimum_on_minutes:
          name: Minimum on time
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: minutes
        minimum_off_minutes:
          name: Minimum off time
          description: Normal recovery observes this delay. CO2 override, critical, and sensor-fault fail-on bypass it.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: minutes
    observability:
      name: Observation and notification
      icon: mdi:clipboard-text-clock-outline
      input:
        live_mode:
          name: Live mode
          default: false
          selector:
            boolean:
        notification_actions:
          name: Optional notification actions
          default: []
          selector:
            action:
        send_notifications:
          name: Send optional notifications
          default: false
          selector:
            boolean:

variables:
  recommendation_sensor: !input recommendation_sensor
  erv_switch: !input erv_switch
  manual_blocker: !input manual_blocker
  decision_persistence_minutes: !input decision_persistence_minutes
  minimum_on_minutes: !input minimum_on_minutes
  minimum_off_minutes: !input minimum_off_minutes
  live_mode: !input live_mode
  send_notifications: !input send_notifications

triggers:
  - trigger: state
    entity_id: !input recommendation_sensor
    id: recommendation_changed
  - trigger: state
    entity_id: !input manual_blocker
    id: manual_blocker_changed
  - trigger: homeassistant
    event: start
    id: startup_recheck
  - trigger: time_pattern
    minutes: "/5"
    id: periodic_recheck

conditions: []

actions:
  - variables:
      recommendation: "{{ states(recommendation_sensor) }}"
      current_switch_state: "{{ states(erv_switch) }}"
      blocker_active: "{{ not is_state(manual_blocker, 'off') }}"
      recommendation_age_seconds: >-
        {{ now().timestamp() - as_timestamp(states[recommendation_sensor].last_changed, 0)
           if states[recommendation_sensor] is not none else 0 }}
      switch_age_seconds: >-
        {{ now().timestamp() - as_timestamp(states[erv_switch].last_changed, 0)
           if states[erv_switch] is not none else 0 }}
      persistence_seconds: "{{ decision_persistence_minutes | float(10) * 60 }}"
      minimum_on_seconds: "{{ minimum_on_minutes | float(10) * 60 }}"
      minimum_off_seconds: "{{ minimum_off_minutes | float(10) * 60 }}"
      recommendation_stable: >-
        {{ states[recommendation_sensor] is not none
           and recommendation_age_seconds | float >= persistence_seconds | float }}
      desired_state: >-
        {% if blocker_active or current_switch_state not in ['on', 'off'] %}
          hold
        {% elif recommendation == 'pollution_hold' %}
          off
        {% else %}
          on
        {% endif %}
      force_on: "{{ recommendation not in ['normal_ventilation', 'pollution_hold'] }}"
      control_decision: >-
        {% if blocker_active %} hold_manual_blocker
        {% elif current_switch_state not in ['on', 'off'] %} hold_actuator_unavailable
        {% elif desired_state == current_switch_state %} no_change_already_{{ current_switch_state }}
        {% elif not recommendation_stable and not force_on %} hold_recommendation_persistence
        {% elif desired_state == 'on' and switch_age_seconds | float < minimum_off_seconds | float and not force_on %} hold_minimum_off_time
        {% elif desired_state == 'off' and switch_age_seconds | float < minimum_on_seconds | float %} hold_minimum_on_time
        {% elif desired_state == 'on' %} turn_on
        {% else %} turn_off
        {% endif %}
      decision_message: >-
        Continuous ERV {{ 'live' if live_mode else 'dry-run' }} decision={{ control_decision }}; recommendation={{ recommendation }}; selected_co2_ppm={{ state_attr(recommendation_sensor, 'selected_co2_ppm') | default('unknown') }}; outdoor_pm25={{ state_attr(recommendation_sensor, 'outdoor_pm25_ug_m3') | default('unknown') }}; switch={{ current_switch_state }}; blocker={{ blocker_active }}.

  - action: system_log.write
    data:
      level: info
      logger: blueprints.continuous_erv
      message: "{{ decision_message }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ live_mode and is_state(manual_blocker, 'off') and control_decision == 'turn_on' }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ erv_switch }}"
      - conditions:
          - condition: template
            value_template: "{{ live_mode and is_state(manual_blocker, 'off') and control_decision == 'turn_off' }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ erv_switch }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ send_notifications }}"
        sequence: !input notification_actions

mode: restart
max_exceeded: silent
trace:
  stored_traces: 20
