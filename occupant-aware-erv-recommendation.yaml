blueprint:
  name: "Continuous ERV Outdoor-Air Compromise Sensor. Version: 2.0.1"
  description: |
    **Version: 2.0.1**

    Policy sensor for a continuous-duty ERV such as the Panasonic FV-10VEC2.
    Normal operation is continuous ventilation. The only normal off recommendation
    is a confirmed outdoor PM2.5 pollution hold while indoor CO2 remains below the
    configured override. PM2.5 hysteresis prevents threshold chatter.

    Outdoor VOC, occupancy, and humidity are supporting diagnostics only. This
    blueprint never controls the ERV directly.
  domain: template
  author: hass-blueprints
  homeassistant:
    min_version: "2025.4.0"
  input:
    sensors:
      name: Air-quality sensors
      icon: mdi:air-filter
      input:
        recommendation_name:
          name: Recommendation sensor name
          default: Continuous ERV Recommendation
          selector:
            text:
        indoor_co2_primary:
          name: Primary indoor CO2 sensor
          description: Required. ppm; the highest fresh selected reading wins.
          selector:
            entity:
              filter:
                domain: sensor
        indoor_co2_secondary:
          name: Secondary indoor CO2 sensor (optional)
          description: Optional. ppm; included in the highest-reading selection.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        outdoor_pm25:
          name: Outdoor PM2.5 sensor
          description: Required primary signal for temporarily pausing outdoor-air exchange.
          selector:
            entity:
              filter:
                domain: sensor
        outdoor_voc:
          name: Outdoor VOC/AQ index sensor (optional)
          description: Supporting diagnostic only; never switches the ERV by itself.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        occupancy:
          name: Occupancy sensor (optional diagnostic)
          description: Diagnostic only. The ERV normally runs continuously whether occupied or not.
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
        indoor_humidity:
          name: Indoor humidity sensor (optional diagnostic)
          description: Diagnostic only. It does not create routine duty cycling.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
    thresholds:
      name: Compromise thresholds and freshness
      icon: mdi:tune
      input:
        sensor_max_age_minutes:
          name: Sensor maximum age
          default: 15
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: minutes
        co2_pollution_override_ppm:
          name: CO2 pollution-override threshold
          description: At or above this value, ventilation resumes despite outdoor PM2.5. Default 1200 ppm.
          default: 1200
          selector:
            number:
              min: 700
              max: 2500
              step: 50
              unit_of_measurement: ppm
        co2_critical_ppm:
          name: Critical CO2 threshold
          description: Immediate ventilation. Must be at or above the pollution override.
          default: 1400
          selector:
            number:
              min: 800
              max: 3000
              step: 50
              unit_of_measurement: ppm
        pm25_hold_ug_m3:
          name: PM2.5 pollution-hold entry threshold
          description: Enter pollution hold at or above this fresh outdoor reading. Default 55 µg/m³ (approximately the EPA Unhealthy PM2.5 boundary).
          default: 55
          selector:
            number:
              min: 5
              max: 250
              step: 1
              unit_of_measurement: µg/m³
        pm25_release_ug_m3:
          name: PM2.5 pollution-hold release threshold
          description: Resume normal continuous ventilation at or below this value. Must be below the entry threshold. Default 35 µg/m³.
          default: 35
          selector:
            number:
              min: 0
              max: 245
              step: 1
              unit_of_measurement: µg/m³

variables:
  recommendation_name: !input recommendation_name
  indoor_co2_primary: !input indoor_co2_primary
  indoor_co2_secondary: !input indoor_co2_secondary
  outdoor_pm25: !input outdoor_pm25
  outdoor_voc: !input outdoor_voc
  occupancy: !input occupancy
  indoor_humidity: !input indoor_humidity
  sensor_max_age_minutes: !input sensor_max_age_minutes
  co2_pollution_override_ppm: !input co2_pollution_override_ppm
  co2_critical_ppm: !input co2_critical_ppm
  pm25_hold_ug_m3: !input pm25_hold_ug_m3
  pm25_release_ug_m3: !input pm25_release_ug_m3

triggers:
  - trigger: state
    entity_id:
      - !input indoor_co2_primary
      - !input outdoor_pm25
  - trigger: time_pattern
    minutes: "/5"

sensor:
  - name: "{{ recommendation_name }}"
    icon: mdi:air-filter
    state: >-
      {% set max_age = sensor_max_age_minutes | float(15) * 60 %}
      {% set ns = namespace(co2_values=[]) %}
      {% for entity_id in [indoor_co2_primary, indoor_co2_secondary] if entity_id not in ['', none] %}
        {% set raw = states(entity_id) %}
        {% set age = now().timestamp() - as_timestamp(states[entity_id].last_updated, 0) %}
        {% if raw not in ['unknown', 'unavailable', 'none', ''] and 350 <= raw | float(-1) <= 10000 and age <= max_age %}
          {% set ns.co2_values = ns.co2_values + [raw | float] %}
        {% endif %}
      {% endfor %}
      {% set co2 = ns.co2_values | max if ns.co2_values else none %}
      {% set pm_raw = states(outdoor_pm25) %}
      {% set pm_age = now().timestamp() - as_timestamp(states[outdoor_pm25].last_updated, 0) %}
      {% set pm_valid = pm_raw not in ['unknown', 'unavailable', 'none', ''] and 0 <= pm_raw | float(-1) <= 2000 and pm_age <= max_age %}
      {% set previous_thresholds = this.attributes.thresholds | default({}, true) %}
      {% set same_policy = previous_thresholds is mapping and previous_thresholds.get('pm25_hold_ug_m3', -1) | float(-1) == pm25_hold_ug_m3 | float and previous_thresholds.get('pm25_release_ug_m3', -1) | float(-1) == pm25_release_ug_m3 | float %}
      {% set previous_hold = this.attributes.outdoor_pollution_latched | default(false, true) | bool(false) if same_policy else false %}
      {% set pm_hold = pm_valid and (pm_raw | float >= pm25_hold_ug_m3 | float or (previous_hold and pm_raw | float > pm25_release_ug_m3 | float)) %}
      {% set thresholds_valid = pm25_release_ug_m3 | float < pm25_hold_ug_m3 | float and co2_pollution_override_ppm | float <= co2_critical_ppm | float %}
      {% if not thresholds_valid %} sensor_fault
      {% elif co2 is none %} sensor_fault
      {% elif co2 >= co2_critical_ppm | float %} critical
      {% elif co2 >= co2_pollution_override_ppm | float %} ventilation_required
      {% elif not pm_valid %} sensor_fault
      {% elif pm_hold %} pollution_hold
      {% else %} normal_ventilation
      {% endif %}
    attributes:
      decision_reason: >-
        {% set max_age = sensor_max_age_minutes | float(15) * 60 %}
        {% set ns = namespace(values=[]) %}
        {% for entity_id in [indoor_co2_primary, indoor_co2_secondary] if entity_id not in ['', none] %}
          {% set raw = states(entity_id) %}
          {% set age = now().timestamp() - as_timestamp(states[entity_id].last_updated, 0) %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] and 350 <= raw | float(-1) <= 10000 and age <= max_age %}
            {% set ns.values = ns.values + [raw | float] %}
          {% endif %}
        {% endfor %}
        {% set co2 = ns.values | max if ns.values else none %}
        {% set pm_raw = states(outdoor_pm25) %}
        {% set pm_valid = pm_raw not in ['unknown', 'unavailable', 'none', ''] and 0 <= pm_raw | float(-1) <= 2000 and now().timestamp() - as_timestamp(states[outdoor_pm25].last_updated, 0) <= max_age %}
        {% set previous_thresholds = this.attributes.thresholds | default({}, true) %}
        {% set same_policy = previous_thresholds is mapping and previous_thresholds.get('pm25_hold_ug_m3', -1) | float(-1) == pm25_hold_ug_m3 | float and previous_thresholds.get('pm25_release_ug_m3', -1) | float(-1) == pm25_release_ug_m3 | float %}
        {% set previous_hold = this.attributes.outdoor_pollution_latched | default(false, true) | bool(false) if same_policy else false %}
        {% set pm_hold = pm_valid and (pm_raw | float >= pm25_hold_ug_m3 | float or (previous_hold and pm_raw | float > pm25_release_ug_m3 | float)) %}
        {% if pm25_release_ug_m3 | float >= pm25_hold_ug_m3 | float or co2_pollution_override_ppm | float > co2_critical_ppm | float %} invalid_threshold_order
        {% elif co2 is none %} no_fresh_valid_indoor_co2_fail_on
        {% elif co2 >= co2_critical_ppm | float %} critical_indoor_co2_ventilation_required
        {% elif co2 >= co2_pollution_override_ppm | float %} indoor_co2_outweighs_outdoor_pollution
        {% elif not pm_valid %} outdoor_pm25_unknown_fail_on
        {% elif pm_hold %} confirmed_outdoor_pm25_pollution_hold
        {% else %} normal_continuous_ventilation
        {% endif %}
      selected_co2_ppm: >-
        {% set max_age = sensor_max_age_minutes | float(15) * 60 %}
        {% set ns = namespace(values=[]) %}
        {% for entity_id in [indoor_co2_primary, indoor_co2_secondary] if entity_id not in ['', none] %}
          {% set raw = states(entity_id) %}
          {% set age = now().timestamp() - as_timestamp(states[entity_id].last_updated, 0) %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] and 350 <= raw | float(-1) <= 10000 and age <= max_age %}
            {% set ns.values = ns.values + [raw | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.values | max | round(0) if ns.values else 'unknown' }}
      valid_co2_sources: >-
        {% set max_age = sensor_max_age_minutes | float(15) * 60 %}
        {% set ns = namespace(values=[]) %}
        {% for entity_id in [indoor_co2_primary, indoor_co2_secondary] if entity_id not in ['', none] %}
          {% set raw = states(entity_id) %}
          {% set age = now().timestamp() - as_timestamp(states[entity_id].last_updated, 0) %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] and 350 <= raw | float(-1) <= 10000 and age <= max_age %}
            {% set ns.values = ns.values + [entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.values | join(', ') if ns.values else 'none' }}
      outdoor_pm25_ug_m3: "{{ states(outdoor_pm25) if states(outdoor_pm25) not in ['unknown', 'unavailable', 'none', ''] else 'unknown' }}"
      outdoor_pm25_status: >-
        {% set age = now().timestamp() - as_timestamp(states[outdoor_pm25].last_updated, 0) %}
        {% if states(outdoor_pm25) in ['unknown', 'unavailable', 'none', ''] %} unavailable
        {% elif age > sensor_max_age_minutes | float(15) * 60 %} stale
        {% elif states(outdoor_pm25) | float(-1) < 0 or states(outdoor_pm25) | float(-1) > 2000 %} invalid
        {% else %} valid
        {% endif %}
      outdoor_pollution_latched: >-
        {% set max_age = sensor_max_age_minutes | float(15) * 60 %}
        {% set raw = states(outdoor_pm25) %}
        {% set valid = raw not in ['unknown', 'unavailable', 'none', ''] and 0 <= raw | float(-1) <= 2000 and now().timestamp() - as_timestamp(states[outdoor_pm25].last_updated, 0) <= max_age %}
        {% set previous_thresholds = this.attributes.thresholds | default({}, true) %}
        {% set same_policy = previous_thresholds is mapping and previous_thresholds.get('pm25_hold_ug_m3', -1) | float(-1) == pm25_hold_ug_m3 | float and previous_thresholds.get('pm25_release_ug_m3', -1) | float(-1) == pm25_release_ug_m3 | float %}
        {% set previous = this.attributes.outdoor_pollution_latched | default(false, true) | bool(false) if same_policy else false %}
        {{ previous if not valid else (raw | float >= pm25_hold_ug_m3 | float or (previous and raw | float > pm25_release_ug_m3 | float)) }}
      outdoor_voc_status: >-
        {% if outdoor_voc in ['', none] %} not_configured
        {% elif states(outdoor_voc) in ['unknown', 'unavailable', 'none', ''] %} unavailable
        {% elif now().timestamp() - as_timestamp(states[outdoor_voc].last_updated, 0) > sensor_max_age_minutes | float(15) * 60 %} stale
        {% else %} supporting_only
        {% endif %}
      occupancy_status: "{{ states(occupancy) if occupancy not in ['', none] else 'not_configured' }}"
      humidity_status: >-
        {% if indoor_humidity in ['', none] %} not_configured
        {% elif states(indoor_humidity) in ['unknown', 'unavailable', 'none', ''] %} unavailable
        {% elif now().timestamp() - as_timestamp(states[indoor_humidity].last_updated, 0) > sensor_max_age_minutes | float(15) * 60 %} stale
        {% else %} {{ states(indoor_humidity) }}
        {% endif %}
      co2_overrides_pollution: >-
        {% set max_age = sensor_max_age_minutes | float(15) * 60 %}
        {% set ns = namespace(values=[]) %}
        {% for entity_id in [indoor_co2_primary, indoor_co2_secondary] if entity_id not in ['', none] %}
          {% set raw = states(entity_id) %}
          {% set age = now().timestamp() - as_timestamp(states[entity_id].last_updated, 0) %}
          {% if raw not in ['unknown', 'unavailable', 'none', ''] and 350 <= raw | float(-1) <= 10000 and age <= max_age %}
            {% set ns.values = ns.values + [raw | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.values | length > 0 and ns.values | max >= co2_pollution_override_ppm | float }}
      thresholds: >-
        {{ {'co2_pollution_override_ppm': co2_pollution_override_ppm | float, 'co2_critical_ppm': co2_critical_ppm | float, 'pm25_hold_ug_m3': pm25_hold_ug_m3 | float, 'pm25_release_ug_m3': pm25_release_ug_m3 | float, 'sensor_max_age_minutes': sensor_max_age_minutes | float} }}
      operating_contract: >-
        Normal state is continuous ventilation. Only confirmed fresh outdoor PM2.5 may request an off hold. High indoor CO2 and sensor faults fail on.
