blueprint:
  name: "Camera Security Popup — Four Sources. Version: 2.1.0"
  description: |
    **Version: 2.1.0**

    Shows a fullscreen `custom:advanced-camera-card` Browser Mod popup for one of
    four explicitly paired motion/camera sources. Each motion source has its own
    optional door-contact gate and title, eliminating ambiguous camera routing.

    The Home Assistant mode gate uses exact equality. Each popup carries a stable
    Browser Mod `tag`, so only the popup associated with the motion source that
    cleared is closed. This is optimized for always-on Android dashboards.

    Requirements: Browser Mod and `custom:advanced-camera-card`.
  domain: automation
  author: hass-blueprints
  source_url: https://github.com/myevit/hass-blueprints/blob/main/security-camera-kiosk-popup.yml
  homeassistant:
    min_version: "2025.4.0"
  input:
    operating_policy:
      name: Operating policy
      icon: mdi:shield-check-outline
      input:
        house_mode:
          name: House mode entity
          description: Popup operation is permitted only when this entity exactly matches the required state.
          selector:
            entity:
              filter:
                domain: input_select
        required_house_mode:
          name: Required house mode
          default: "Normal"
          selector:
            text:
        browser_ids_template:
          name: Browser Mod target template
          description: >-
            Jinja template that returns Browser Mod browser ID(s). It may use live
            states to avoid targeting a dashboard already showing cameras.
          selector:
            template:
        motion_clear_seconds:
          name: Motion-clear cooldown
          description: Seconds motion must remain off before only its tagged popup is closed.
          default: 20
          selector:
            number:
              min: 1
              max: 300
              step: 1
              mode: box
              unit_of_measurement: seconds
        popup_timeout_seconds:
          name: Maximum popup duration
          default: 120
          selector:
            number:
              min: 30
              max: 3600
              step: 10
              mode: box
              unit_of_measurement: seconds
    source_1:
      name: Camera source 1
      icon: mdi:camera-outline
      input:
        camera_1:
          name: Camera
          selector:
            entity:
              filter:
                domain: camera
        motion_1:
          name: Motion sensor
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: motion
        door_1:
          name: Door contact (optional)
          description: If selected, popup opens only while this contact is off (closed).
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: door
        title_1:
          name: Popup title
          default: ""
          selector:
            text:
    source_2:
      name: Camera source 2
      icon: mdi:camera-outline
      input:
        camera_2:
          name: Camera
          selector:
            entity:
              filter:
                domain: camera
        motion_2:
          name: Motion sensor
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: motion
        door_2:
          name: Door contact (optional)
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: door
        title_2:
          name: Popup title
          default: ""
          selector:
            text:
    source_3:
      name: Camera source 3
      icon: mdi:camera-outline
      input:
        camera_3:
          name: Camera
          selector:
            entity:
              filter:
                domain: camera
        motion_3:
          name: Motion sensor
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: motion
        door_3:
          name: Door contact (optional)
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: door
        title_3:
          name: Popup title
          default: ""
          selector:
            text:
    source_4:
      name: Camera source 4
      icon: mdi:camera-outline
      input:
        camera_4:
          name: Camera
          selector:
            entity:
              filter:
                domain: camera
        motion_4:
          name: Motion sensor
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: motion
        door_4:
          name: Door contact (optional)
          default: ""
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: door
        title_4:
          name: Popup title
          default: ""
          selector:
            text:

variables:
  house_mode: !input house_mode
  required_house_mode: !input required_house_mode
  browser_ids: !input browser_ids_template
  popup_timeout_seconds: !input popup_timeout_seconds
  door_1: !input door_1
  door_2: !input door_2
  door_3: !input door_3
  door_4: !input door_4

triggers:
  - trigger: state
    entity_id: !input motion_1
    to: "on"
    id: source_1_on
    variables:
      camera_entity: !input camera_1
      door_contact: !input door_1
      popup_title: !input title_1
      popup_tag: camera-popup-source-1
  - trigger: state
    entity_id: !input motion_1
    to: "off"
    for:
      seconds: !input motion_clear_seconds
    id: source_1_off
    variables:
      popup_tag: camera-popup-source-1
  - trigger: state
    entity_id: !input motion_2
    to: "on"
    id: source_2_on
    variables:
      camera_entity: !input camera_2
      door_contact: !input door_2
      popup_title: !input title_2
      popup_tag: camera-popup-source-2
  - trigger: state
    entity_id: !input motion_2
    to: "off"
    for:
      seconds: !input motion_clear_seconds
    id: source_2_off
    variables:
      popup_tag: camera-popup-source-2
  - trigger: state
    entity_id: !input motion_3
    to: "on"
    id: source_3_on
    variables:
      camera_entity: !input camera_3
      door_contact: !input door_3
      popup_title: !input title_3
      popup_tag: camera-popup-source-3
  - trigger: state
    entity_id: !input motion_3
    to: "off"
    for:
      seconds: !input motion_clear_seconds
    id: source_3_off
    variables:
      popup_tag: camera-popup-source-3
  - trigger: state
    entity_id: !input motion_4
    to: "on"
    id: source_4_on
    variables:
      camera_entity: !input camera_4
      door_contact: !input door_4
      popup_title: !input title_4
      popup_tag: camera-popup-source-4
  - trigger: state
    entity_id: !input motion_4
    to: "off"
    for:
      seconds: !input motion_clear_seconds
    id: source_4_off
    variables:
      popup_tag: camera-popup-source-4

conditions:
  - condition: template
    value_template: "{{ states(house_mode) == required_house_mode }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id.endswith('_on') }}"
          - condition: template
            value_template: "{{ not door_contact or is_state(door_contact, 'off') }}"
        sequence:
          - action: browser_mod.popup
            data:
              browser_id: "{{ browser_ids }}"
              tag: "{{ popup_tag }}"
              dismissable: true
              title: "{{ popup_title or state_attr(camera_entity, 'friendly_name') or camera_entity }}"
              size: fullscreen
              auto_focus: true
              content:
                type: custom:advanced-camera-card
                cameras:
                  - camera_entity: "{{ camera_entity }}"
                    live_provider: ha
                    preload: true
                layout:
                  fit: contain
                menu:
                  style: none
                status_bar:
                  style: none
                live:
                  auto_unmute:
                    - visible
                    - selected
                  controls:
                    builtin: false
                  lazy_load: false
                  preload: true
                view:
                  timeout:
                    seconds: "{{ popup_timeout_seconds | int }}"
                    action: close
      - conditions:
          - condition: template
            value_template: "{{ trigger.id.endswith('_off') }}"
        sequence:
          - action: browser_mod.close_popup
            data:
              browser_id: "{{ browser_ids }}"
              tag: "{{ popup_tag }}"

mode: parallel
max: 4
max_exceeded: silent
trace:
  stored_traces: 20
