blueprint:
  name: "MQTT Philips Hue Dimmer RWL022 (Scene Preset Integration). v3.6.4"
  description: >-
    Control lights with a Philips Hue Dimmer Switch. Scene Preset integration is required https://github.com/Hypfer/hass-scene_presets
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    dimmer_switch:
      name: Dimmer Switch Action Sensor
      description: Select the action sensor of your Philips Hue Dimmer Switch
      selector:
        device:
          filter:
            - integration: mqtt
          multiple: false
    light:
      name: Lights
      description: The lights to control
      selector:
        entity:
          filter:
            - domain: light
          multiple: true
    tv_entity:
      name: TV Entity
      description: The TV entity to check (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: false
    lights_when_tv_on:
      name: Lights When TV On
      description: The lights to control when the TV is on (optional)
      default: []
      selector:
        entity:
          filter:
            - domain: light
          multiple: true
    included_scenes:
      name: Hue Button Scenes
      description: Scenes to be included. The first scene will be used only for the main ON button.
      default: []
      selector:
        select:
          multiple: true
          options:
            - label: Static Rest
              value: "Static Rest"
            - label: Static Relax
              value: "Static Relax"
            - label: Static Read
              value: "Static Read"
            - label: Static Concentrate
              value: "Static Concentrate"
            - label: Static Bright
              value: "Static Bright"
            - label: Static Dimmed
              value: "Static Dimmed"
            - label: Dynamic Galaxy
              value: "Dynamic Galaxy"
            - label: Dynamic Nighttime
              value: "Dynamic Nighttime"
            - label: Dynamic Sleepy
              value: "Dynamic Sleepy"
            - label: Dynamic Unwind
              value: "Dynamic Unwind"
            - label: Dynamic Storybook
              value: "Dynamic Storybook"
            - label: Dynamic Shine
              value: "Dynamic Shine"
            - label: Dynamic Arise
              value: "Dynamic Arise"
            - label: Static Galaxy
              value: "Static Galaxy"
            - label: Static Nighttime
              value: "Static Nighttime"
            - label: Static Sleepy
              value: "Static Sleepy"
            - label: Static Unwind
              value: "Static Unwind"
            - label: Static Storybook
              value: "Static Storybook"
            - label: Static Shine
              value: "Static Shine"
            - label: Static Arise
              value: "Static Arise"
            - label: Static Aurora
              value: "Static Aurora"
            - label: Dynamic Aurora
              value: "Dynamic Aurora"
    dynamic_transition:
      name: Dynamic Transition
      description: Transition time between changes of the dynamic colour states
      default: 45
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: sec
          mode: slider
    dynamic_interval:
      name: Dynamic Interval
      description: Time between changes of the dynamic colour states
      default: 60
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: sec
          mode: slider
    scene_helper:
      name: Scene Helper
      description: Please select an Input Text Helper to be used to record the scene sequence in JSON format with timestamp.
      selector:
        entity:
          filter:
            - domain: input_text
          multiple: false
    brightness_zigbee:
      name: Brightness Control via Zigbee2MQTT
      description: If enabled, brightness will be controlled directly by Zigbee2MQTT instead of the blueprint
      default: false
      selector:
        boolean:
    reset_after:
      name: Reset After
      description: Timeout in seconds after which the order is reset to the first scene.
      default: 5
      selector:
        number:
          min: 1.0
          max: 120.0
          step: 1.0
          unit_of_measurement: s
          mode: slider
    tv_time_start:
      name: TV Time Start
      description: Start time for TV-based logic (optional, format HH:MM)
      default: ""
      selector:
        time:

mode: single
max_exceeded: silent

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: on_press_release
    id: on_press_release
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: on_hold_release
  #   id: on_hold_release
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: off_press_release
  #   id: off_press_release
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: off_hold_release
  #   id: off_hold_release
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: up_press_release
    id: up_press_release
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: up_hold_release
  #   id: up_hold_release
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: down_press_release
    id: down_press_release
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: down_hold_release
  #   id: down_hold_release
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: recall_0
  #   id: recall_0
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: recall_1
  #   id: recall_1
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: on_press
  #   id: on_press
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: on_hold
    id: on_hold
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: off_press
    id: off_press
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: off_hold
  #   id: off_hold
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: up_press
  #   id: up_press
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: up_hold
    id: up_hold
  # - trigger: device
  #   domain: mqtt
  #   device_id: !input dimmer_switch
  #   type: action
  #   subtype: down_press
  #   id: down_press
  - trigger: device
    domain: mqtt
    device_id: !input dimmer_switch
    type: action
    subtype: down_hold
    id: down_hold
variables:
  command: "{{ trigger.id }}"
  included_scene_labels: !input included_scenes
  preset_map:
    "Static Rest": {"preset_id": "e03267e7-9914-4f47-97fe-63c0bd317fe7", "type": "static"}
    "Static Relax": {"preset_id": "e71b2ef3-1b15-4c4b-b036-4b3d6efe58f8", "type": "static"}
    "Static Read": {"preset_id": "035b6ecf-414e-4781-abc7-3911556097cb", "type": "static"}
    "Static Concentrate": {"preset_id": "0cbec4e8-d064-4457-986a-fe6078a63f39", "type": "static"}
    "Static Bright": {"preset_id": "6d10a807-7330-46d1-b093-c15520ba72c0", "type": "static"}
    "Static Dimmed": {"preset_id": "8f55e62a-e5f8-456a-9e8b-61f314bd4e99", "type": "static"}
    "Dynamic Galaxy": {"preset_id": "a6ba3a6e-1e3a-41fd-84f2-f7b021935deb", "type": "dynamic"}
    "Dynamic Nighttime": {"preset_id": "cfdb43c7-ccb3-4dd1-b4c7-036e0d74aeb9", "type": "dynamic"}
    "Dynamic Sleepy": {"preset_id": "6170702c-f2fc-46fc-99ef-ac98b6c1293e", "type": "dynamic"}
    "Dynamic Unwind": {"preset_id": "f7c2f4ce-f957-4745-b9bf-651d5b81c9a6", "type": "dynamic"}
    "Dynamic Storybook": {"preset_id": "4f76cd74-28db-455b-9c11-04654be86281", "type": "dynamic"}
    "Dynamic Shine": {"preset_id": "ded92eba-901e-4675-8a77-2d17d95aac54", "type": "dynamic"}
    "Dynamic Arise": {"preset_id": "d7225176-5cb9-47f3-ab99-8ca9908866fc", "type": "dynamic"}
    "Static Galaxy": {"preset_id": "a6ba3a6e-1e3a-41fd-84f2-f7b021935deb", "type": "static"}
    "Static Nighttime": {"preset_id": "cfdb43c7-ccb3-4dd1-b4c7-036e0d74aeb9", "type": "static"}
    "Static Sleepy": {"preset_id": "6170702c-f2fc-46fc-99ef-ac98b6c1293e", "type": "static"}
    "Static Unwind": {"preset_id": "f7c2f4ce-f957-4745-b9bf-651d5b81c9a6", "type": "static"}
    "Static Storybook": {"preset_id": "4f76cd74-28db-455b-9c11-04654be86281", "type": "static"}
    "Static Shine": {"preset_id": "ded92eba-901e-4675-8a77-2d17d95aac54", "type": "static"}
    "Static Arise": {"preset_id": "d7225176-5cb9-47f3-ab99-8ca9908866fc", "type": "static"}
    "Static Aurora": {"preset_id": "940fd864-51e1-4761-95d3-75d4d68835ea", "type": "static"}
    "Dynamic Aurora": {"preset_id": "940fd864-51e1-4761-95d3-75d4d68835ea", "type": "dynamic"}
  included_scenes: >
    {% set labels = included_scene_labels if included_scene_labels is sequence else [included_scene_labels] %}
    {% set ns = namespace(out=[]) %}
    {% for item in labels %}
      {% set item_str = item | string %}
      {% if item is mapping %}
        {% set ns.out = ns.out + [item | to_json] %}
      {% elif preset_map[item_str] is defined %}
        {% set ns.out = ns.out + [preset_map[item_str] | to_json] %}
      {% elif item_str | regex_search('\"preset_id\"') %}
        {% set ns.out = ns.out + [item_str] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}
  scene_count: "{{ included_scenes | length }}"
  scene_helper: !input scene_helper
  reset_after: !input reset_after
  tv_entity: !input tv_entity
  lights_when_tv_on: !input lights_when_tv_on
  all_lights: !input light
  brightness_zigbee: !input brightness_zigbee
  tv_time_start: !input tv_time_start
  tv_time_end: "03:00"
  press_change: 18
  transition_time: 0.8
  is_tv_time: >
    {% set now = now().strftime('%H:%M') %}
    {% if tv_time_start and tv_time_end %}
      {% if tv_time_start <= tv_time_end %}
        {{ now >= tv_time_start and now < tv_time_end }}
      {% else %}
        {{ now >= tv_time_start or now < tv_time_end }}
      {% endif %}
    {% else %}
      true
    {% endif %}
  target_lights: >
    {% set tv_on = tv_entity and is_state(tv_entity, 'on') %}
    {% set valid_tv_lights = (lights_when_tv_on if lights_when_tv_on is sequence else [lights_when_tv_on]) | select('string') | list %}
    {% set valid_all_lights = (all_lights if all_lights is sequence else [all_lights]) | select('string') | list %}
    {% if tv_on and valid_tv_lights and is_tv_time %}
      {{ valid_tv_lights }}
    {% elif valid_all_lights %}
      {{ valid_all_lights }}
    {% else %}
      []
    {% endif %}
  lights_to_turn_off: >
    {% set tv_on = tv_entity and is_state(tv_entity, 'on') %}
    {% set valid_tv_lights = (lights_when_tv_on if lights_when_tv_on is sequence else [lights_when_tv_on]) | select('string') | list %}
    {% set valid_all_lights = (all_lights if all_lights is sequence else [all_lights]) | select('string') | list %}
    {% if tv_on and valid_tv_lights and is_tv_time %}
      {{ valid_all_lights | reject('in', valid_tv_lights) | list }}
    {% else %}
      []
    {% endif %}
  last_preset_index: >
    {% set data = states(scene_helper) %}
    {% if data != "unknown" and data != "" and data | regex_search('\"scene\"') %}
      {% set parsed = data | from_json %}
      {% if (as_timestamp(now()) - parsed.timestamp) < reset_after %}
        {{ parsed.scene }}
      {% else %}
      0
      {% endif %}
    {% else %}
      0
    {% endif %}
  last_action_time: >
    {% set data = states(scene_helper) %}
    {% if data != "unknown" and data != "" and data | regex_search('\"timestamp\"') %}
      {{ (data | from_json).timestamp }}
    {% else %}
      0
    {% endif %}
  current_scene_info: >
    {% if scene_count > 0 %}
      {{ included_scenes[last_preset_index] | from_json }}
    {% else %}
      {{ {"preset_id": "", "type": ""} }}
    {% endif %}
  next_preset_index: >-
    {% if scene_count == 0 %}
      0
    {% elif command == 'off_press' %}
      {{ (last_preset_index + 1) % scene_count }}
    {% elif command in ['on_press_release', 'on_hold'] %}
      0
    {% else %}
      {{ last_preset_index }}
    {% endif %}

actions:
  - condition: template
    value_template: "{{ included_scenes | length > 0 }}"
  - condition: template
    value_template: >-
      {% set min_delay = 0.1 %}  {# Half second minimum delay between actions #}
      {{ (as_timestamp(now()) - last_action_time) > min_delay }}
  - choose:
      - conditions:
          - "{{ lights_to_turn_off | length > 0 }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights_to_turn_off }}"
            data:
              transition: >-
                {% set lights = expand(lights_to_turn_off) | selectattr('state', 'eq', 'on') | list %}
                {% if lights | length > 0 %}
                  {% set avg_brightness = (lights | map(attribute='attributes.brightness') | select('number') | list | sum) / (lights | length) %}
                  {% set avg_brightness_pct = (avg_brightness / 255 * 100) | round %}
                  {{ 0 if avg_brightness_pct < 10 else transition_time }}
                {% else %}
                  {{ transition_time }}
                {% endif %}
  - choose:
      - conditions:
          - "{{ command == 'tv_on' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights_to_turn_off }}"
            data:
              transition: >-
                {% set lights = expand(lights_to_turn_off) | selectattr('state', 'eq', 'on') | list %}
                {% if lights | length > 0 %}
                  {% set avg_brightness = (lights | map(attribute='attributes.brightness') | select('number') | list | sum) / (lights | length) %}
                  {% set avg_brightness_pct = (avg_brightness / 255 * 100) | round %}
                  {{ 0 if avg_brightness_pct < 10 else transition_time }}
                {% else %}
                  {{ transition_time }}
                {% endif %}
      - conditions:
          - "{{ command == 'on_press_release' }}"
        sequence:
          - choose:
              - conditions: "{{ target_lights | length > 0 and expand(target_lights) | selectattr('state', 'eq', 'on') | list | length == 0 }}"
                sequence:
                  - action: scene_presets.stop_dynamic_scenes_for_targets
                    data:
                      targets:
                        entity_id: "{{ target_lights }}"
                  - choose:
                      - conditions: "{{ (included_scenes[0] | from_json).type == 'static' or (included_scenes[0] | from_json).type == '' }}"
                        sequence:
                          - action: scene_presets.apply_preset
                            data:
                              preset_id: "{{ (included_scenes[0] | from_json).preset_id }}"
                              targets:
                                entity_id: "{{ target_lights }}"
                              shuffle: false
                              smart_shuffle: false
                      - conditions: "{{ (included_scenes[0] | from_json).type == 'dynamic' }}"
                        sequence:
                          - action: scene_presets.start_dynamic_scene
                            data:
                              preset_id: "{{ (included_scenes[0] | from_json).preset_id }}"
                              targets:
                                entity_id: "{{ target_lights }}"
                              transition: !input dynamic_transition
                              interval: !input dynamic_interval
              - conditions: "{{ target_lights | length > 0 and expand(target_lights) | selectattr('state', 'eq', 'on') | list | length > 0 }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      transition: "{{ transition_time }}"
                  - action: scene_presets.stop_dynamic_scenes_for_targets
                    data:
                      targets:
                        entity_id: "{{ target_lights }}"
      - conditions:
          - "{{ command == 'on_hold' }}"
        sequence:
          - action: scene_presets.stop_dynamic_scenes_for_targets
            data:
              targets:
                entity_id: "{{ target_lights }}"
          - choose:
              - conditions: "{{ (included_scenes[0] | from_json).type == 'static' or (included_scenes[0] | from_json).type == '' }}"
                sequence:
                  - action: scene_presets.apply_preset
                    data:
                      preset_id: "{{ (included_scenes[0] | from_json).preset_id }}"
                      targets:
                        entity_id: "{{ target_lights }}"
                      shuffle: false
                      smart_shuffle: false
              - conditions: "{{ (included_scenes[0] | from_json).type == 'dynamic' }}"
                sequence:
                  - action: scene_presets.start_dynamic_scene
                    data:
                      preset_id: "{{ (included_scenes[0] | from_json).preset_id }}"
                      targets:
                        entity_id: "{{ target_lights }}"
                      transition: !input dynamic_transition
                      interval: !input dynamic_interval
      - conditions:
          - "{{ command in ['up_hold', 'up_press_release', 'down_hold', 'down_press_release'] }}"
        sequence:
          - variables:
              current_brightness: >
                {% set lights = expand(target_lights) | selectattr('state', 'eq', 'on') | rejectattr('attributes.brightness', 'none') | list %}
                {{ lights | map(attribute='attributes.brightness') | average(128) | int }}
              new_brightness: >
                {% set step = press_change if command in ['up_hold', 'up_press_release'] else -press_change %}
                {% set target = current_brightness + (step * 2.55) %}
                {{ ([1, target | int, 255] | sort)[1] }}
          - choose:
              # Handle static scenes
              - conditions:
                  - "{{ current_scene_info.type == 'static' or not current_scene_info.type }}"
                  - "{{ not (brightness_zigbee | default(false)) }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
                    data:
                      brightness: "{{ new_brightness }}"
                      transition: "{{ transition_time }}"

              # Handle dynamic scenes (no brightness_zigbee check)
              - conditions:
                  - "{{ current_scene_info.type == 'dynamic' }}"
                sequence:
                  - action: scene_presets.start_dynamic_scene
                    data:
                      preset_id: "{{ current_scene_info.preset_id }}"
                      targets:
                        entity_id: "{{ target_lights }}"
                      transition: !input dynamic_transition
                      interval: !input dynamic_interval
                      brightness: "{{ new_brightness }}"
      - conditions:
          - "{{ command == 'off_press' }}"
        sequence:
          - action: scene_presets.stop_dynamic_scenes_for_targets
            data:
              targets:
                entity_id: "{{ target_lights }}"
          - choose:
              - conditions: "{{ (included_scenes[next_preset_index] | from_json).type == 'static' }}"
                sequence:
                  - action: scene_presets.apply_preset
                    data:
                      preset_id: "{{ (included_scenes[next_preset_index] | from_json).preset_id }}"
                      targets:
                        entity_id: "{{ target_lights }}"
                      shuffle: false
                      smart_shuffle: false
              - conditions: "{{ (included_scenes[next_preset_index] | from_json).type == 'dynamic' }}"
                sequence:
                  - action: scene_presets.start_dynamic_scene
                    data:
                      preset_id: "{{ (included_scenes[next_preset_index] | from_json).preset_id }}"
                      targets:
                        entity_id: "{{ target_lights }}"
                      transition: !input dynamic_transition
                      interval: !input dynamic_interval
  - action: input_text.set_value
    target:
      entity_id: !input scene_helper
    data:
      value: >
        {{ {
          "scene": next_preset_index,
          "timestamp": as_timestamp(now()),
        } | to_json }}
  - delay:
      seconds: "{{ transition_time }}"
